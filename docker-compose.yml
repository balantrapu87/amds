services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Orchestrator & Remotion Dispatcher
  # ---------------------------------------------------------------------------
  fastapi-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motion-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - RENDER_CONCURRENCY=16
      - LLM_ENDPOINT=http://host.docker.internal:8080/v1/chat/completions
      - LLM_MODEL=qwen
      - LLM_CODER_MODEL=qwen-coder
      - EDGE_TTS_VOICE=en-US-AriaNeural
      # Local AI services (Whisper + ComfyUI Wan 2.1 on the host)
      - WHISPER_URL=http://host.docker.internal:8080/v1/audio/transcriptions
      - WAN_COMFYUI_URL=http://host.docker.internal:8080/comfyui
      - WAN_MODEL=wan2.1_t2v_14B_fp8_e4m3fn.safetensors
      - WAN_FALLBACK_MODEL=wan2.1_t2v_1.3B_fp16.safetensors
      - NARRATION_TAIL_MS=750
      - OUTPUT_DIR=/app/output
      - JOBS_DIR=/app/jobs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./output:/app/output
      - ./jobs:/app/jobs
      - ./assets:/app/assets
      - /var/run/docker.sock:/var/run/docker.sock
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "992"  # render group
      - "44"   # video group
    networks:
      - motion-net
      - llama-swap_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 2. Dedicated Remotion Worker (Headless Chromium ANGLE acceleration)
  # ---------------------------------------------------------------------------
  remotion-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motion-remotion-worker
    restart: unless-stopped
    command: ["sleep", "infinity"]
    volumes:
      - ./output:/app/output
      - ./jobs:/app/jobs
      - ./remotion:/app/remotion
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"
      - "44"
    networks:
      - motion-net

networks:
  motion-net:
    driver: bridge
  llama-swap_default:
    external: true
